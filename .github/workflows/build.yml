name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or unzip project
        id: find
        run: |
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then
            Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$Z" ]; then
              echo "Found zip: $Z -> extracting"
              mkdir -p "$RUNNER_TEMP/proj"
              unzip -q -o "$Z" -d "$RUNNER_TEMP/proj"
              F=$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts | head -n 1)
            fi
          fi
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            ls -R | head -60
            exit 1
          fi
          echo "Project dir: $(dirname "$F")"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OtgMapper-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
